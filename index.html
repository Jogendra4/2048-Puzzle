<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048: Neo Merge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #102a43;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      position: relative;
    }
    #game-container {
      width: 90vw;
      max-width: 360px;
      background: #ffffff22;
      padding: 16px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      touch-action: none;
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #header h1 {
      font-size: 6vw;
      max-font-size: 32px;
      color: #e0f7fa;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
    }
    #controls {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: #e0f7fa;
      border: none;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.15s, box-shadow 0.15s;
      color: #102a43;
      font-weight: 600;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.3); }
    .btn:active { transform: translateY(0); box-shadow: 0 3px 6px rgba(0,0,0,0.2); }
    #score-box {
      background: #e0f7fa;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 12px;
      color: #102a43;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
      text-align: center;
      flex-shrink: 0;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2.5vw;
      background: #ffffff11;
      padding: 3vw;
      border-radius: 12px;
      box-shadow: inset 0 4px 16px rgba(0,0,0,0.2);
    }
    .cell {
      width: 20vw;
      max-width: 64px;
      height: 20vw;
      max-height: 64px;
      background: #ffffff22;
      border-radius: 10px;
      font-size: 5vw;
      max-font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s, transform 0.3s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      color: #102a43;
      font-weight: 600;
    }
    .cell.new { animation: pop 0.25s ease-out; }
    @keyframes pop { 0% { transform: scale(0.3); } 100% { transform: scale(1); }}
    /* Tile colors */
    .cell[data-value="2"]   { background: #ffe0b2; }
    .cell[data-value="4"]   { background: #ffcc80; }
    .cell[data-value="8"]   { background: #ffb74d; }
    .cell[data-value="16"]  { background: #ff9800; }
    .cell[data-value="32"]  { background: #fb8c00; }
    .cell[data-value="64"]  { background: #f57c00; }
    .cell[data-value="128"] { background: #ef6c00; }
    .cell[data-value="256"] { background: #e65100; }
    .cell[data-value="512"] { background: #d84315; }
    .cell[data-value="1024"]{ background: #bf360c; }
    .cell[data-value="2048"]{ background: #3e2723; color: #fff; }
    /* Ad container */
    #ad-container {
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 8px 0;
      background: rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="header">
      <h1>2048</h1>
      <div id="score-box">Score: <span id="score">0</span></div>
    </div>
    <div id="controls">
      <button class="btn" id="btn-new">New Game</button>
    </div>
    <div id="grid"></div>
  </div>  <!-- Ad script inserted at bottom -->  <div id="ad-container">
    <script type="text/javascript">
      atOptions = {
        'key' : 'e6397e2e427c488880e1f233aad05ab1',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/e6397e2e427c488880e1f233aad05ab1/invoke.js"></script>
  </div>  <script>
    const SIZE=4; let grid,score,prev;
    let tx=0,ty=0;
    const gridEl=document.getElementById('grid'), scoreEl=document.getElementById('score');
    const btnNew=document.getElementById('btn-new');

    function init(){
      grid=Array(SIZE).fill().map(()=>Array(SIZE).fill(0));
      score=0; prev=null;
      spawn(); spawn(); render();
      document.addEventListener('keydown',keyHandler);
      const c=document.getElementById('game-container');
      c.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; tx=t.clientX; ty=t.clientY; });
      c.addEventListener('touchend',e=>{ const t=e.changedTouches[0]; const dx=t.clientX-tx, dy=t.clientY-ty;
        if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>30) move(dx>0?'right':'left');
        else if(Math.abs(dy)>30) move(dy>0?'down':'up');
      });
    }
    function save(){ prev={g:grid.map(r=>r.slice()),s:score}; }
    function spawn(){ const empt=[]; grid.forEach((r,i)=>r.forEach((v,j)=>!v&&empt.push({i,j}))); if(!empt.length)return;
      const{ i,j }=empt[Math.floor(Math.random()*empt.length)]; grid[i][j]=Math.random()<0.9?2:4;
    }
    function render(){ gridEl.innerHTML=''; grid.forEach(r=>r.forEach(v=>{
      const d=document.createElement('div'); d.className='cell';
      if(v){ d.textContent=v; d.dataset.value=v; d.classList.add('new'); setTimeout(()=>d.classList.remove('new'),250);} gridEl.append(d);
    })); scoreEl.textContent=score; checkOver(); }
    function keyHandler(e){ const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key]; m&&move(m); }
    function move(dir){ save(); let m=false;
      if(dir==='left') m=swipe(row=>row);
      if(dir==='right') m=swipe(row=>row.reverse(),true);
      if(dir==='up') m=swipeCol(col=>col,'up');
      if(dir==='down') m=swipeCol(col=>col.reverse(),'down');
      if(m){ spawn(); render(); }
    }
    function swipe(transform,rev){ let moved=false;
      grid=grid.map(r=>{ const o=r.slice(); let a=transform(r).filter(v=>v);
        for(let i=0;i<a.length-1;i++) if(a[i]===a[i+1]){ a[i]*=2; score+=a[i]; a[i+1]=0;} a=a.filter(v=>v);
        const n=a.concat(Array(SIZE-a.length).fill(0)); if(rev)n.reverse();
        if(n.toString()!==o.toString()) moved=true; return n;
      }); return moved;
    }
    function swipeCol(transform,dir){ let moved=false;
      for(let c=0;c<SIZE;c++){ const col=grid.map(r=>r[c]); const o=col.slice();
        let a=transform(col).filter(v=>v);
        for(let i=0;i<a.length-1;i++) if(a[i]===a[i+1]){ a[i]*=2; score+=a[i]; a[i+1]=0;} a=a.filter(v=>v);
        const n=(dir==='up'? a.concat(Array(SIZE-a.length).fill(0)) : Array(SIZE-a.length).fill(0).concat(a));
        n.forEach((v,i)=>grid[i][c]=v); if(n.toString()!==o.toString()) moved=true;
      } return moved;
    }
    function checkOver(){
      for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE;j++){
        if(!grid[i][j] || (j<SIZE-1 && grid[i][j]===grid[i][j+1]) || (i<SIZE-1 && grid[i][j]===grid[i+1][j])) return;
      }
      setTimeout(()=>alert('Game Over! Score:'+score),100);
      document.removeEventListener('keydown',keyHandler);
    }
    btnNew.addEventListener('click',init);
    // Ensure game starts on page load
    window.onload = init;
  </script></body>
</html>
